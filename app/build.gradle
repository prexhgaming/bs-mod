plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

def keystorePropertiesFile = rootProject.file('app/keystore/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"

    defaultConfig {
        applicationId "top.niunaijun.blackboxa"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The UI is English-only: dropping the ~60 locales that appcompat/material
        // ship removes a few hundred KB of strings/NOTICE data from the APK.
        resourceConfigurations += ['en']

        // Single universal APK, 32-bit only: the game is an armeabi-v7a library
        // and a 64-bit process cannot load it, so shipping arm64 would let the
        // sandbox spawn a process the game can never map into. Keep this in sync
        // with APP_ABI in app/src/main/cpp/Application.mk.
        ndk {
            abiFilters 'armeabi-v7a'
            debugSymbolLevel 'none'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file("keystore/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 does the shrinking: see proguard-rules.pro for what the engine
            // needs to keep. Everything else (app code, unused libs) gets trimmed.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    buildFeatures {
        viewBinding true
    }

    // ndk-build module: the in-game mod menu -> libzyn-bs.so (app/src/main/cpp).
    // Android.mk/Application.mk are the single build description (the archive's
    // own), so STL, ABI, API level and the 16 KB page flag all live there.
    // Mapped ONLY inside the game's own process — BlackBoxLoader's guest
    // lifecycle hook calls ZynBs.load(); the host process never loads it.
    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    packaging {
        jniLibs {
            // Compressed native libs = smaller APK.
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/*.kotlin_module',
                    'META-INF/*.version',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'kotlin/**',
                    'DebugProbesKt.bin'
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation project(':Bcore')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.core.ktx
    implementation libs.recyclerview

    // Single-screen UI: live data + coroutines only.
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    // Long-press app actions dialog.
    implementation 'com.afollestad.material-dialogs:core:3.3.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
