plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

// The renjana engine, packaged as a library so a thin loader app can own the
// UI and the application id. Everything that used to live in an application
// module (applicationId, signing, ABI splits, the launcher activity) now lives
// in :loader — this module only ships code, resources and manifest entries.
android {
    namespace 'com.fesu.renjana'
    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Runtime-needed classes (Pine hooks, Room, reflection targets) must
        // survive R8 in the consuming app, so the rules ship with the library.
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core
    api 'androidx.core:core-ktx:1.12.0'
    api 'androidx.appcompat:appcompat:1.6.1'
    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    api 'androidx.activity:activity-compose:1.8.0'

    // Compose — the engine still carries its own screens, even though the
    // loader does not show them. api so they resolve for anyone reusing them.
    api platform('androidx.compose:compose-bom:2023.10.01')
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.ui:ui-graphics'
    api 'androidx.compose.ui:ui-tooling-preview'
    api 'androidx.compose.material3:material3'
    api 'androidx.compose.material:material-icons-extended'
    api 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    api 'androidx.navigation:navigation-compose:2.7.4'

    // Hooking (Root) - Xposed API (compileOnly, not bundled at runtime).
    // Pine provides Xposed API compatibility at runtime via pine:xposed below.
    compileOnly 'de.robv.android.xposed:api:82'

    // Hooking (Non-Root) - Pine framework (bundled, includes native libpine.so).
    // core: the hook engine (Pine.hook, PineConfig).
    api 'top.canyie.pine:core:0.3.0'
    // xposed: Xposed compatibility bridge — lets XC_MethodHook / XposedHelpers / XposedBridge
    // work transparently on top of Pine. Required because CoreHooks uses Xposed callback types.
    api 'top.canyie.pine:xposed:0.2.0'

    // Google Play Services (compileOnly for virtualization)
    compileOnly 'com.google.android.gms:play-services-auth:20.7.0'
    compileOnly 'com.google.android.gms:play-services-base:18.2.0'

    // Database
    api 'androidx.room:room-runtime:2.6.0'
    api 'androidx.room:room-ktx:2.6.0'
    ksp 'androidx.room:room-compiler:2.6.0'

    // Utilities
    api 'com.google.code.gson:gson:2.10.1'

    // Coroutines
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
