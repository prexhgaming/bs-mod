name: Build lib

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r27d

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The NDK is installed by unpacking the official archive with `unzip`.
      # Do NOT replace this with a setup action: those extract the zip through a
      # JS extractor that does not recreate symlinks, so clang++ (a symlink to
      # clang) ends up dangling and every compile dies with
      # "clang++: No such file or directory" even though the directory exists.
      # `unzip` creates the symlinks, which is why this path builds reliably.
      - name: Cache NDK
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/ndk.zip"

      - name: Build
        working-directory: jni
        run: |
          "$RUNNER_TEMP/android-ndk-${NDK_VERSION}/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=./Application.mk \
            APP_BUILD_SCRIPT=./Android.mk

      - name: Package
        run: |
          mkdir -p artifacts
          zip -j artifacts/libzyn-bs.zip jni/libs/armeabi-v7a/libzyn-bs.so
          ls -lh artifacts/libzyn-bs.zip

      - uses: actions/upload-artifact@v4
        with:
          name: libzyn-bs
          path: artifacts/libzyn-bs.zip

      - name: Send to Telegram
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are missing"
            exit 1
          fi
          curl -sS -f -o /dev/null \
            -F "chat_id=$CHAT" \
            -F "document=@artifacts/libzyn-bs.zip;filename=libzyn-bs.zip" \
            -F "caption=libzyn-bs ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot$TOKEN/sendDocument"
