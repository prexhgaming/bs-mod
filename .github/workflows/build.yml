name: Build lib

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r27d

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The NDK is installed by unpacking the official archive with `unzip`.
      # Do NOT replace this with a setup action: those extract the zip through a
      # JS extractor that does not recreate symlinks, so clang++ (a symlink to
      # clang) ends up dangling and every compile dies with
      # "clang++: No such file or directory" even though the directory exists.
      # `unzip` creates the symlinks, which is why this path builds reliably.
      - name: Cache NDK
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/ndk.zip"

      # Everything is captured in build.log so a failure can be shipped as a
      # file. `pipefail` matters: without it the pipeline's status is tee's,
      # which is always 0, and a broken build would report success. `2>&1`
      # matters too - the compiler writes its errors to stderr.
      - name: Build
        id: build
        working-directory: jni
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/android-ndk-${NDK_VERSION}/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=./Application.mk \
            APP_BUILD_SCRIPT=./Android.mk 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package
        run: |
          mkdir -p artifacts
          zip -j artifacts/libzyn-bs.zip jni/libs/armeabi-v7a/libzyn-bs.so
          ls -lh artifacts/libzyn-bs.zip

      - uses: actions/upload-artifact@v4
        with:
          name: libzyn-bs
          path: artifacts/libzyn-bs.zip

      # Skipped automatically on failure (default `success()`), so this only
      # runs when the build actually produced a library.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # One send, never both: the log when the build failed, the zip when it
      # succeeded. Gated on the Build step's own outcome rather than the job's,
      # so a packaging problem after a good build still delivers the log.
      - name: Notify Telegram
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ] || [ -z "${CHAT:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are missing"
            exit 1
          fi

          if [ "$BUILD_RESULT" = "success" ] && [ -f artifacts/libzyn-bs.zip ]; then
            file="artifacts/libzyn-bs.zip"
            caption="libzyn-bs ${GITHUB_SHA:0:7}"
          else
            file="$GITHUB_WORKSPACE/build.log"
            caption="build failed ${GITHUB_SHA:0:7}"
          fi

          if [ ! -f "$file" ]; then
            echo "::error::nothing to send: $file does not exist"
            exit 1
          fi

          echo "sending $(basename "$file") ($(wc -c < "$file") bytes)"
          curl -sS -f -o /dev/null \
            -F "chat_id=$CHAT" \
            -F "document=@$file;filename=$(basename "$file")" \
            -F "caption=$caption" \
            "https://api.telegram.org/bot$TOKEN/sendDocument"
