name: Build Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_LOG: build.log

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No SDK or NDK install step: Gradle does it. AGP downloads the platform,
      # build-tools and the NDK pinned by ndkVersion (android.builder.sdkDownload
      # in gradle.properties) using the runner's SDK and its accepted licences.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore and create signing properties
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "::error::SIGNING_KEYSTORE_BASE64 is missing"; exit 1; }

          mkdir -p loader/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > loader/keystore/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > loader/keystore/keystore.properties

          ls -la loader/keystore/

      - name: Notify Telegram that the build started
        run: |
          curl -sS -f -o /dev/null \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "text=build started ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Build release APK
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :loader:assembleRelease --no-daemon 2>&1 | tee "$BUILD_LOG"

      - name: Verify APK contents
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find loader/build/outputs/apk -type f -name '*.apk' -print -quit)"
          [ -n "$apk" ] || { echo "::error::no APK produced"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/armeabi-v7a/libzyn-bs.so' \
            || { echo "::error::libzyn-bs.so missing from APK"; exit 1; }
          unzip -l "$apk" | grep -q 'META-INF/.*\.RSA' \
            || { echo "::error::APK is not release-signed"; exit 1; }
          ls -lh "$apk"

      - name: Upload APK to Telegram
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find loader/build/outputs/apk -type f -name '*.apk' -print -quit)"
          curl -sS -f -o /dev/null \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@$apk;filename=bs-loader.apk" \
            -F "caption=bs-loader ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

      - name: Notify Telegram about build failure
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$BUILD_LOG" ] || { echo "no build log to send"; exit 0; }
          curl -sS -f -o /dev/null \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@$BUILD_LOG;filename=build.log" \
            -F "caption=build failed ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f loader/keystore/release.jks loader/keystore/keystore.properties
          rmdir loader/keystore 2>/dev/null || true

      - name: Upload build log artifact
        if: always() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bs-loader
          path: loader/build/outputs/apk/release/loader-release.apk
          if-no-files-found: error
