name: Build loader

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # NDK r27d. Must match the `ndkVersion` in loader/build.gradle; that file reads
  # -PndkVersion if given, so this stays the single place CI pins it.
  NDK_REVISION: 27.3.13750724

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs cmdline-tools (so `sdkmanager` is on PATH) and accepts the SDK
      # licences, which is what lets the NDK install below run unattended.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Resolve the SDK root explicitly instead of relying on the action's env
      # export being visible to `${{ env.* }}` in a later step's `with:`.
      - name: Resolve SDK root
        id: sdk
        run: |
          set -euo pipefail
          root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "SDK root: $root"

      # The NDK is installed by the official SDK manager, the same way Android
      # Studio does it. That matters: the archive contains symlinks (clang++ ->
      # clang) and sdkmanager recreates them. Some third-party "setup-ndk"
      # actions extract through a JS zip reader that drops symlinks, leaving
      # clang++ dangling so every compile dies with
      # "clang++: No such file or directory". sdkmanager does not have that bug.
      #
      # Cached because the download is ~660 MB and the toolchain only changes
      # when NDK_REVISION does.
      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/ndk/${{ env.NDK_REVISION }}
          key: ndk-${{ env.NDK_REVISION }}-${{ runner.os }}

      - name: Install NDK ${{ env.NDK_REVISION }}
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Licences are already accepted by setup-android; </dev/null stops
          # sdkmanager blocking on a prompt. Deliberately NOT `yes |`: under
          # `pipefail`, `yes` dying from SIGPIPE (141) once sdkmanager exits
          # would fail the step on an otherwise successful install.
          sdkmanager --install "ndk;${NDK_REVISION}" < /dev/null
          sdkmanager --list_installed | grep "ndk;${NDK_REVISION}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # One build. The mod's ndk-build project lives in loader/src/main/cpp and
      # runs through externalNativeBuild, so this compiles libzyn-bs.so and
      # packages it into the APK — there is no separate native step any more.
      # The NDK is found through ndkVersion, so nothing is passed in here.
      #
      # Everything is captured in build.log so a failure can be shipped as a
      # file. `pipefail` matters: without it the pipeline's status is tee's,
      # which is always 0, and a broken build would report success. `2>&1`
      # matters too - both clang and Gradle write their errors to stderr.
      #
      # No signing secrets needed: loader/keystore/ is committed so the APK keeps
      # the same signature as the previous release and upgrades in place.
      - name: Build release APK
        id: apk
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :loader:assembleRelease --no-daemon --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp loader/build/outputs/apk/release/loader-release.apk artifacts/bs-loader.apk

          # Proves the mod actually made it in; a missing .so would otherwise
          # only surface as a silent System.loadLibrary failure on device.
          unzip -l artifacts/bs-loader.apk | grep -q 'lib/armeabi-v7a/libzyn-bs.so' \
            || { echo "::error::libzyn-bs.so is missing from the APK"; exit 1; }
          unzip -l artifacts/bs-loader.apk | grep 'lib/armeabi-v7a/libzyn-bs.so'

          # Proves it was signed with the committed release key and not with the
          # debug key (which would break in-place upgrades).
          unzip -l artifacts/bs-loader.apk | grep -q 'META-INF/.*\.RSA' \
            || { echo "::error::APK is not signed with a release key"; exit 1; }

          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: bs-loader
          path: artifacts/bs-loader.apk

      # Skipped automatically on success (default `success()`).
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # One send, never both: the log when the build failed, the APK when it
      # succeeded. Gated on the build step's own outcome, so a packaging problem
      # after a good compile still delivers the log rather than a stale APK.
      - name: Notify Telegram
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_RESULT: ${{ steps.apk.outcome }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ] || [ -z "${CHAT:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are missing"
            exit 1
          fi

          if [ "$APK_RESULT" = "success" ] && [ -f artifacts/bs-loader.apk ]; then
            file="artifacts/bs-loader.apk"
            caption="bs-loader ${GITHUB_SHA:0:7}"
          else
            file="$GITHUB_WORKSPACE/build.log"
            caption="build failed ${GITHUB_SHA:0:7}"
          fi

          if [ ! -f "$file" ]; then
            echo "::error::nothing to send: $file does not exist"
            exit 1
          fi

          echo "sending $(basename "$file") ($(wc -c < "$file") bytes)"
          curl -sS -f -o /dev/null \
            -F "chat_id=$CHAT" \
            -F "document=@$file;filename=$(basename "$file")" \
            -F "caption=$caption" \
            "https://api.telegram.org/bot$TOKEN/sendDocument"
