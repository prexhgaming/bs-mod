name: Build lib + Send to Telegram

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip -d $HOME/android-ndk
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build native library with ndk-build
        run: |
          cd "$GITHUB_WORKSPACE"
          "$ANDROID_NDK_ROOT/ndk-build" -j4

      - name: List build output
        run: find "$GITHUB_WORKSPACE/libs" -type f -name '*.so' -exec ls -lh {} \;

      - name: Create zip of built library
        id: zip
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts
          zip -j artifacts/libzyn-bs.zip libs/armeabi-v7a/libzyn-bs.so
          echo "zip_path=artifacts/libzyn-bs.zip" >> $GITHUB_OUTPUT
          ls -lh artifacts/libzyn-bs.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzyn-bs
          path: artifacts/libzyn-bs.zip

      - name: Verify Telegram secrets are set
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_CHAT_ID secret is missing. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Telegram secrets present."

      - name: Send zip to Telegram
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CAPTION="bs-mod build ($GITHUB_SHA)"
          if [ -n "$COMMIT_MSG" ]; then
            CAPTION="$CAPTION - ${COMMIT_MSG:0:80}"
          fi
          curl -sS -f \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@$ZIP_PATH;filename=libzyn-bs.zip" \
            -F "caption=$CAPTION" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
