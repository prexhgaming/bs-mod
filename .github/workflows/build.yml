name: Build Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_LOG: build.log

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No SDK or NDK install step: Gradle does it. AGP downloads the platform,
      # build-tools and the NDK pinned by ndkVersion (android.builder.sdkDownload
      # in gradle.properties) using the runner's SDK and its accepted licences.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Signing material goes to the REPOSITORY ROOT, because loader/build.gradle
      # resolves it against rootProject.projectDir. Keeping it out of loader/
      # is what removes the module-relative lookup that silently fell back to the
      # debug key before.
      - name: Decode keystore and create signing properties
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v is missing"; exit 1; }
          done

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

          ls -l release.jks keystore.properties

      - name: Notify Telegram that the build started
        run: |
          curl -sS -f -o /dev/null \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "text=build started ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Build release APK
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :loader:assembleRelease --no-daemon 2>&1 | tee "$BUILD_LOG"

      - name: Verify APK contents
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find loader/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          [ -n "$apk" ] || { echo "::error::no APK produced"; exit 1; }

          # Dump the listing first: `unzip -l | grep -q` would let grep close the
          # pipe early, and under `pipefail` the resulting SIGPIPE fails the step
          # even on a successful match.
          unzip -l "$apk" > "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/armeabi-v7a/libzyn-bs.so' "$RUNNER_TEMP/apk-contents.txt" \
            || { echo "::error::libzyn-bs.so missing from APK"; exit 1; }

          # No signature check here: signing is optional by design. The `release`
          # signing config only exists when keystore.properties is present, so a
          # missing keystore yields a deliberately unsigned APK rather than a
          # failure — asserting on the signing would fail builds that are correct.
          ls -lh "$apk"

      - name: Upload APK to Telegram
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find loader/build/outputs/apk -type f -name '*.apk' -print -quit)"
          curl -sS -f -o /dev/null \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@$apk;filename=bs-loader.apk" \
            -F "caption=bs-loader ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

      # Text only, and only truthful: the old step attached build.log captioned
      # "build failed" whenever ANY later step tripped, so a green Gradle run that
      # only failed post-build verification still arrived looking like a dead
      # build. The full log stays in the build-log artifact instead.
      - name: Notify Telegram about build failure
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          GRADLE_OUTCOME: ${{ steps.gradle_build.outcome }}
        run: |
          set -euo pipefail
          if [ "$GRADLE_OUTCOME" = "success" ]; then
            text="post-build check failed ${GITHUB_SHA:0:7} — Gradle build itself succeeded, see the build-log artifact"
          else
            text="build failed ${GITHUB_SHA:0:7} — see the build-log artifact"
          fi
          curl -sS -f -o /dev/null \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "text=$text" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f release.jks keystore.properties
          echo "removed signing material from the workspace"

      - name: Upload build log artifact
        if: always() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bs-loader
          path: loader/build/outputs/apk/release/loader-release.apk
          if-no-files-found: error
