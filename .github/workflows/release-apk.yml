name: Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle (caches dependencies + wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin explicitly: AGP 8.13.2 requires Gradle >= 8.13, and relying on
          # the runner's preinstalled Gradle silently produced 8.7 failures.
          gradle-version: '8.13'

      - name: Cache Gradle build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/8.13
            .gradle
          key: gradle-build-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-build-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          # Print the version actually in use so a wrapper/runner mismatch is
          # visible in the log instead of surfacing as an opaque AGP error.
          ./gradlew --version 2>&1 | tee build.log
          ./gradlew :app:assembleRelease 2>&1 | tee -a build.log

      - name: Send build.log to Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets missing; skipping notification."
            exit 0
          fi
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          curl -sS -X POST "$API/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="Build FAILED - ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Sending build.log..." || true
          if [ -f build.log ]; then
            if [ "$(stat -c%s build.log)" -gt 20000000 ]; then
              tail -c 20000000 build.log > build.log.trim
              mv build.log.trim build.log
            fi
            curl -sS -X POST "$API/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F caption="build.log - failed build ${GITHUB_SHA::7}" \
              -F document=@build.log || true
          else
            curl -sS -X POST "$API/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="No build.log was produced (failure happened before Gradle ran)." || true
          fi

      - name: Report APK sizes
        if: always() && steps.build.outcome == 'success'
        run: |
          {
            echo "## Release APK sizes"
            echo ""
            echo "| APK | Size |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            size=$(du -h "$apk" | cut -f1)
            echo "| \`$(basename "$apk")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done
          shopt -u nullglob

      - name: Upload APK as workflow artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Send APK to Telegram on success
        if: always() && steps.build.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets missing; skipping notification."
            exit 0
          fi
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          shopt -u nullglob
          if [ ${#apks[@]} -eq 0 ]; then
            curl -sS -X POST "$API/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="Build reported success but no APK was found." || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            size=$(du -h "$apk" | cut -f1)
            curl -sS -X POST "$API/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F caption="Build OK - $(basename "$apk") ($size) - ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" \
              -F document=@"$apk"
          done