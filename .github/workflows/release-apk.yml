name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK/NDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          # Pinned by app/build.gradle + Bcore/build.gradle (ndkVersion).
          # If the SDK repo does not have it yet, AGP falls back to its own resolver.
          sdkmanager --install "ndk;29.0.13846066" > /dev/null 2>&1 || true
          echo "Installed NDKs:"; ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Report APK sizes
        run: |
          {
            echo "## Release APK sizes"
            echo ""
            echo "| APK | Size |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            size=$(du -h "$apk" | cut -f1)
            echo "| \`$(basename "$apk")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done
          shopt -u nullglob

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30