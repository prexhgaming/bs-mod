name: Build Debug APK

# Debug variant only: no signing secrets, no Telegram. Every step here needs
# nothing but the repository, so it is safe to run on pull requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No SDK/NDK install step: android.builder.sdkDownload=true lets AGP fetch
      # the platform, build-tools and the NDK pinned by ndkVersion itself.
      #
      # Deliberately NO actions/cache here. A shared ~/.gradle/caches entry would
      # be writable by both workflows; because the cache is immutable per key, the
      # first writer wins and a debug-built entry could then be restored into the
      # release run (and vice versa), handing release debug-variant outputs and
      # auto-generated debug signing state. Debug stays cache-free so it can never
      # poison a signed release build.

      # Nothing to decode and nothing to clean up: the debug variant is signed
      # with the auto-generated debug keystore, so this needs no secrets at all.
      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :loader:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bs-loader-debug
          path: loader/build/outputs/apk/debug/*.apk
          if-no-files-found: error
