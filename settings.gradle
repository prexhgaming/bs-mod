pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // compileOnly Xposed API 82 (renjana's hooks compile against it).
        maven { url 'https://api.xposed.info/' }
    }
}

rootProject.name = "Bs"

// :core  — the renjana engine, packaged as a library (no UI ownership, no app id).
// :loader — the app: old cinematic single-screen launcher, depends on :core.
include ':core'
include ':loader'
