# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=34

# Let AGP install missing SDK packages itself (platform, build-tools, and the
# NDK pinned by ndkVersion in loader/build.gradle) using the accepted licences
# in $ANDROID_HOME. This is what lets CI run with no sdkmanager step.
android.builder.sdkDownload=true
