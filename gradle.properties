# Project-wide Gradle settings.
# 4g rather than 2g: with parallel execution enabled, :core's Kotlin/KSP work and
# :loader's NDK build run at the same time and both live in this daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Run independent tasks of different modules at the same time. The win here is
# :loader:externalNativeBuild (the ~1 min ndk-build) overlapping with
# :core's Kotlin/KSP compile, which it does not depend on.
org.gradle.parallel=true

# Reuse task outputs between builds and across CI runs (~/.gradle/caches is
# cached in the workflow), so an unchanged module is not rebuilt.
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=34

# Let AGP install missing SDK packages itself (platform, build-tools, and the
# NDK pinned by ndkVersion in loader/build.gradle) using the accepted licences
# in $ANDROID_HOME. This is what lets CI run with no sdkmanager step.
android.builder.sdkDownload=true
